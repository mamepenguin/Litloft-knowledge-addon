[pytest]
testpaths = tests
asyncio_mode = auto

# Coverage is measured on every run, including a partial one — `pytest -k x`
# measured nothing at all before this. `--cov-branch` because a line that ran
# is not a branch that was taken; it lowers the reported total because it
# counts something line coverage does not.
#
# The floor is deliberately NOT here. `--cov-fail-under` in `addopts` fails
# every partial run — `pytest tests/test_note_scanner.py` exits 1 on a passing
# test, including the single-file reproductions a reviewer is asked to run. A
# floor is a claim about a COMPLETE run, so it lives where completeness is
# known: the CI step, as `PYTEST_ADDOPTS`.
#
# `--cov-precision=2` makes the comparison two decimals wide instead of zero.
# At the default precision the comparison is against a whole number, and
# measured here the real total of 85.247686 then refuses a floor of 85.25
# outright, because the rounded 85 never meets it.
#
# The floor is `85.24` and NOT `85.25`, which is why the CI step says so:
# coverage.py prints its pass/fail message from the raw total and computes its
# exit code from the rounded one, and those disagree wherever a total rounds
# UP. Measured here, all six runs identical:
#
#     --cov-fail-under=85.24  "reached"      exit 0    <- what we want
#     --cov-fail-under=85.25  "not reached"  exit 0    <- says failed, passes
#     --cov-fail-under=85.26  "not reached"  exit 1
#
# 85.247686 rounds up to 85.25, so a floor at the rounded value lands exactly
# on that disagreement and gates nothing while printing FAIL. Truncate the
# measured total, never round it, and check the exit code rather than the
# message. (intelligence is unaffected only because 64.780464 rounds down.)
#
# This makes `pytest-cov` a hard requirement of anything that loads this ini:
# without it pytest fails to start, rather than running unmeasured. It is in
# `requirements-test.txt`, installed by `Dockerfile.test`.
#
# `pytest --no-cov -k something` turns measurement off for a tight loop. It is
# a speed switch and nothing depends on it: with the floor out of `addopts`, a
# partial run is green whether or not you pass it.
#
# No `# pragma: no cover` annotations exist in this package (measured, 0), so
# nothing is excluded from the denominator beyond what `--cov=app` selects. If
# any are added, re-measure before trusting this floor: an annotation removes
# uncovered statements, which raises the number without covering anything.
#
# To re-measure, neutralise ONLY the pragma pattern. `exclude_lines` defaults to
# THREE regexes — the pragma one, `...` stub bodies, and `if TYPE_CHECKING:` —
# so overriding the option wholesale re-includes the other two and reports a
# larger effect than the annotations have. Keep the other two:
#
#     [report]
#     exclude_lines =
#         ^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)
#         if (typing\.)?TYPE_CHECKING:
addopts = --cov=app --cov-branch --cov-precision=2 --cov-report=term-missing
